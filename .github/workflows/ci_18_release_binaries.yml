name: CI(18) release binaries

# https://help.github.com/en/articles/events-that-trigger-workflows#release-event-release
# model taken from https://github.com/mockersf/kmanb/releases
# on: release

on:
  # One time per month
  schedule:
    - cron: "0 0 18 * *"
  # Manually triggered
  workflow_dispatch:
  # Disabled right now, when a push is made on master.
#  push:
#    branches:
#    - master
jobs:
  build-linux:
    timeout-minutes: 120  # 2 hours
    runs-on: ubuntu-latest
    permissions:
      # Needed to create / refresh the rolling prerelease and its tag.
      contents: write
    env:
      BOOST_INCDIR: "/usr/include"
      BOOST_LINK: "/usr/lib/x86_64-linux-gnu/libboost_serialization.a"
      EIGEN_PATH: /home/runner/work/opt/eigen
      NETCDF_CXX_ALLINC: "-I/home/runner/work/opt/netcdf-cxx4-4.3.1/include -I/home/runner/work/opt/netcdf-cxx4-4.3.1/include"
      NETCDF_CXX_LINK: "-L/home/runner/work/opt/netcdf-cxx4-4.3.1/lib -lnetcdf_c++4 -Wl,-rpath,/home/runner/work/opt/netcdf-cxx4-4.3.1/lib"
      NAUTY_PATH: /home/runner/work/opt/nauty
      NAUTY_INCLUDE: "-I/home/runner/work/opt/nauty/include"
      NAUTY_LINK: "/home/runner/work/opt/nauty/lib/libnauty_static.a"
      GMP_PATH: /home/runner/work/opt/gmp-6.2.1
      GMP_INCDIR: /home/runner/work/opt/gmp-6.2.1/include
      GMP_CXX_LINK: "/home/runner/work/opt/gmp-6.2.1/lib/libgmpxx.a /home/runner/work/opt/gmp-6.2.1/lib/libgmp.a"
      # Makefile_latt_can_aut_iso references the bliss variables although it is
      # built without -DUSE_BLISS, so it uses Traces and needs no bliss symbol.
      # LIBBLISS_INCDIR must still be non empty, otherwise "-I$(LIBBLISS_INCDIR)"
      # expands to a bare -I that swallows the following flag. LIBBLISS_LINK is
      # left empty on purpose: these are static release binaries and must not
      # gain a dynamic dependency on libbliss.
      LIBBLISS_INCDIR: /usr/include
      LIBBLISS_LINK: ""

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-boost

      - uses: ./.github/actions/install-nauty
      - uses: ./.github/actions/install-eigen

      # The release tag must never be a branch name: uploading with
      # tag: ${{ github.ref }} on a scheduled run created a refs/tags/master
      # alongside refs/heads/master, which makes every "master" refname
      # ambiguous for anyone cloning the repository. Scheduled and manual runs
      # publish to a fixed rolling tag instead; a run started from a real tag
      # (workflow_dispatch on refs/tags/vXXXX) publishes to that tag.
      - name: Resolve the release tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            {
              echo "RELEASE_TAG=${{ github.ref_name }}"
              echo "RELEASE_NAME=${{ github.ref_name }}"
              echo "ROLLING=false"
            } >> "$GITHUB_ENV"
          else
            {
              echo "RELEASE_TAG=continuous-build"
              echo "RELEASE_NAME=Continuous build of ${{ github.ref_name }}"
              echo "ROLLING=true"
            } >> "$GITHUB_ENV"
          fi

      # upload-release-action ignores target_commit when the tag already
      # exists, so the rolling tag would stay pinned to the commit of its first
      # run. Drop the old prerelease and its tag so the new one is recreated at
      # the commit that was actually built. Never touches a version tag.
      - name: Drop the previous rolling prerelease
        if: env.ROLLING == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true

      - name: Build and release
        run: |
          # We need to compile GMP in static
          # wget --no-check-certificate https://gmplib.org/download/gmp/gmp-6.2.1.tar.bz2
          wget https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.bz2
          tar -vxjf gmp-6.2.1.tar.bz2
          # A subshell, so that a failure of any step still fails the job:
          # errexit skips a command that is not the last of an && list.
          ( cd gmp-6.2.1 && ./configure --enable-shared=no --enable-static=yes --enable-cxx --prefix=$GMP_PATH && make && make install )
          echo "After gmp-6.2.1 compilation"

          make -C src_lorentzian -f Makefile_Allcock_edgewalk
          strip src_lorentzian/LORENTZ_FundDomain_AllcockEdgewalk
          echo "After compilation of LORENTZ_FundDomain_AllcockEdgewalk"

          make -C src_latt -f Makefile_latt_can_aut_iso LATT_Canonicalize
          strip src_latt/LATT_Canonicalize
          echo "After compilation of LATT_Canonicalize"

      - name: Make zip of LORENTZ_FundDomain_AllcockEdgewalk
        run: zip -j LORENTZ_FundDomain_AllcockEdgewalk-linux.zip src_lorentzian/LORENTZ_FundDomain_AllcockEdgewalk

      - name: Make zip of LATT_Canonicalize
        run: zip -j LATT_Canonicalize-linux.zip src_latt/LATT_Canonicalize

      - name: Upload LORENTZ_FundDomain_AllcockEdgewalk to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: LORENTZ_FundDomain_AllcockEdgewalk-linux.zip
          asset_name: LORENTZ_FundDomain_AllcockEdgewalk-linux-FINAL.zip
          tag: ${{ env.RELEASE_TAG }}
          release_name: ${{ env.RELEASE_NAME }}
          body: "Statically linked Linux binaries built from ${{ github.ref_name }} at ${{ github.sha }}."
          target_commit: ${{ github.sha }}
          prerelease: ${{ env.ROLLING }}
          make_latest: ${{ env.ROLLING != 'true' }}
          overwrite: true

      - name: Upload LATT_Canonicalize to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: LATT_Canonicalize-linux.zip
          asset_name: LATT_Canonicalize-linux-FINAL.zip
          tag: ${{ env.RELEASE_TAG }}
          release_name: ${{ env.RELEASE_NAME }}
          body: "Statically linked Linux binaries built from ${{ github.ref_name }} at ${{ github.sha }}."
          target_commit: ${{ github.sha }}
          prerelease: ${{ env.ROLLING }}
          make_latest: ${{ env.ROLLING != 'true' }}
          overwrite: true
