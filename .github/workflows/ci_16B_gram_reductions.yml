name: CI(16B) of the reductions of Gram matrices

# https://help.github.com/en/articles/events-that-trigger-workflows#release-event-release
# model taken from https://github.com/mockersf/kmanb/releases
# on: release

# Scheduling syntax is available at
# https://cloud.google.com/scheduler/docs/configuring/cron-job-schedules

on:
  # One time per month
  schedule:
    - cron: "0 0 16 2,4,6,8,10,12 *"
  # Manually triggered
  workflow_dispatch:
  # Disabled right now, when a push is made on master.
jobs:
  build-linux:
    timeout-minutes: 120  # 2 hours
    runs-on: ubuntu-latest
    env:
      GMP_INCDIR: /usr/include
      GMP_CXX_LINK: "-lm -lgmp -lgmpxx"
      BOOST_INCDIR: "/usr/include"
      BOOST_LINK: "/usr/lib/x86_64-linux-gnu/libboost_serialization.a"
      EIGEN_PATH: /home/runner/work/opt/eigen

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-boost

      - uses: ./.github/actions/install-eigen
      - uses: ./.github/actions/install-gap

      - name: Test the reductions of Gram matrices
        run: |
          make -C src_latt -f Makefile_gram_reductions
          echo "After compilation of LATT_Reduction"

          cd CI_tests/16B_GramReductions
          ../../gap.sh < TestReductions.g
          if [ ! -f "CI_CONCLUSION" ]; then
            echo "The gap test code has not created the expected file" >&2
            exit 1
          fi
          cd ../..
          echo "After test of the Gram matrix reductions"
