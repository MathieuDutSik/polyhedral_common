name: CI(15B) of genus enumeration by Kneser neighbours

on:
  # One time every two months, alternating with ci_15A
  schedule:
    - cron: "0 0 15 2,4,6,8,10,12 *"
  # Manually triggered
  workflow_dispatch:
jobs:
  build-linux:
    timeout-minutes: 120  # 2 hours
    runs-on: ubuntu-latest
    env:
      GMP_INCDIR: /usr/include
      GMP_CXX_LINK: "-lm -lgmp -lgmpxx"
      BOOST_INCDIR: "/usr/include"
      BOOST_LINK: "/usr/lib/x86_64-linux-gnu/libboost_serialization.a"
      EIGEN_PATH: /home/runner/work/opt/eigen
      NAUTY_PATH: /home/runner/work/opt/nauty
      NAUTY_INCLUDE: "-I/home/runner/work/opt/nauty/include"
      NAUTY_LINK: "/home/runner/work/opt/nauty/lib/libnauty.a"
      LIBBLISS_PATH: /home/runner/opt/libbliss
      LIBBLISS_INCDIR: /home/runner/opt/libbliss/include
      LIBBLISS_LINK: "-L/home/runner/opt/libbliss/lib -lbliss -Wl,-rpath,/home/runner/opt/libbliss/lib"
      # flint, for Arb (the certified L-values, lvalue=arb) and the flint
      # number types
      ENABLE_FLINT_SUPPORT: "1"
      FLINT_INCDIR: /home/runner/opt/flint/include
      FLINT_LINK: "-L/home/runner/opt/flint/lib -lflint -Wl,-rpath,/home/runner/opt/flint/lib"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # MPFR, for the L-values of the quadratic masses (MassQuadraticHeckeL.h)
      - name: Install MPFR
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpfr-dev

      # flint 3.6.0, the release used for development (Arb is part of it)
      - name: Install flint
        run: |
          wget -q https://github.com/flintlib/flint/releases/download/v3.6.0/flint-3.6.0.tar.gz
          tar -xzf flint-3.6.0.tar.gz
          cd flint-3.6.0
          ./configure --prefix=/home/runner/opt/flint --disable-static
          make -j"$(nproc)"
          make install

      - uses: ./.github/actions/install-boost

      - uses: ./.github/actions/install-nauty
      - uses: ./.github/actions/install-bliss
      - uses: ./.github/actions/install-eigen
      - uses: ./.github/actions/install-gap
      - name: Test genus enumeration
        run: |
          make -C src_genera
          pwd
          echo "After compilation of the genus enumeration code"

          # Running the test
          cd CI_tests/15B_GenusEnumeration
          ./RunTests.sh
          if [ ! -f "CI_CONCLUSION" ]; then
            echo "The genus enumeration test has not created the expected file" >&2
            exit 1
          fi
          cd ../..

      - name: Test the mass of a genus with an isometry
        run: |
          cd CI_tests/15B_GenusEnumeration
          rm -f CI_CONCLUSION
          ./RunIsometryMassTests.sh
          if [ ! -f "CI_CONCLUSION" ]; then
            echo "The isometry mass test has not created the expected file" >&2
            exit 1
          fi
          cd ../..

      - name: Test the enumeration of the lattices with an isometry
        run: |
          cd CI_tests/15B_GenusEnumeration
          rm -f CI_CONCLUSION
          ./RunEnumerateIsometryTests.sh
          if [ ! -f "CI_CONCLUSION" ]; then
            echo "The isometry enumeration test has not created the expected file" >&2
            exit 1
          fi
          cd ../..

      - name: Test the seeds of the lattices with an isometry by gluing
        run: |
          cd CI_tests/15B_GenusEnumeration
          rm -f CI_CONCLUSION
          ./RunGlueIsometryTests.sh
          if [ ! -f "CI_CONCLUSION" ]; then
            echo "The gluing test has not created the expected file" >&2
            exit 1
          fi
          cd ../..

      - name: Test the genera of pairs by characteristic polynomial
        run: |
          cd CI_tests/15B_GenusEnumeration
          rm -f CI_CONCLUSION
          ./RunCharPolyTests.sh
          if [ ! -f "CI_CONCLUSION" ]; then
            echo "The characteristic polynomial test has not created the expected file" >&2
            exit 1
          fi
          cd ../..

      - name: Test the genera of pairs of finite groups (GroupOracle.g)
        run: |
          cd CI_tests/15B_GenusEnumeration
          rm -f CI_CONCLUSION
          ./RunCharPolyTests.sh group_tests_ci.txt
          if [ ! -f "CI_CONCLUSION" ]; then
            echo "The group test has not created the expected file" >&2
            exit 1
          fi
          cd ../..

      - name: Test the target masses computed in C++ (target=auto)
        run: |
          cd CI_tests/15B_GenusEnumeration
          rm -f CI_CONCLUSION
          TARGET=auto ./RunCharPolyTests.sh homcount_tests.txt
          if [ ! -f "CI_CONCLUSION" ]; then
            echo "The target mass test has not created the expected file" >&2
            exit 1
          fi
          cd ../..

      - name: Test the local densities
        run: |
          cd CI_tests/15B_GenusEnumeration
          rm -f CI_CONCLUSION
          ../../gap.sh < TestLocalDensity.g
          if [ ! -f "CI_CONCLUSION" ]; then
            echo "The local density test has not created the expected file" >&2
            exit 1
          fi
          cd ../..

      # the checks in the code (SANITY_CHECK_*), on cases that reach them;
      # it rebuilds the programs it runs
      - name: Test with the SANITY_CHECK macros
        run: |
          make -C src_genera -B GENUS_IsometryMass GENUS_ComponentMass GENUS_MaximalOrder GENUS_GlueIsometry GENUS_HermitianPieces CDEFS="-DGMP_POOL -DSANITY_CHECK -DSANITY_CHECK_FINITE_FIELD -DSANITY_CHECK_POLYQ -DSANITY_CHECK_MAXIMAL_ORDERS_EXTENSIVE -DSANITY_CHECK_HOWELL_FORM_EXTENSIVE -DSANITY_CHECK_LOCAL_IMAGE_EXTENSIVE -DSANITY_CHECK_ISOMETRY_GLUE_FACTORS -DSANITY_CHECK_ISOMETRY_GLUE_FACTORS_EXTENSIVE -DSANITY_CHECK_HERMITIAN_GENUS"
          cd CI_tests/15B_GenusEnumeration
          rm -f CI_CONCLUSION
          ./RunSanityChecks.sh
          if [ ! -f "CI_CONCLUSION" ]; then
            echo "The sanity checks have not created the expected file" >&2
            exit 1
          fi
          cd ../..

      # last, as it rebuilds the programs with the boost types as well
      - name: Test the programs of the pairs with every arithmetic
        run: |
          make -C src_genera -B ENABLE_BOOST_TYPES=1 GENUS_IsometryMass GENUS_ComponentMass GENUS_EnumerateIsometry
          cd CI_tests/15B_GenusEnumeration
          rm -f CI_CONCLUSION
          ./RunArithmeticTests.sh
          if [ ! -f "CI_CONCLUSION" ]; then
            echo "The arithmetic test has not created the expected file" >&2
            exit 1
          fi
          cd ../..
