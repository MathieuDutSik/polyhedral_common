name: CI(04B) cmake compilation of the code.

# https://help.github.com/en/articles/events-that-trigger-workflows#release-event-release
# model taken from https://github.com/mockersf/kmanb/releases
# on: release

on:
  # One time per month
  schedule:
    - cron: "0 0 4 2,4,6,8,10,12 *"
  # Manually triggered
  workflow_dispatch:
  # Disabled right now, when a push is made on master.
jobs:
  build-linux:
    timeout-minutes: 120  # 2 hours
    runs-on: ubuntu-latest
    env:
      GMP_INCDIR: /usr/include
      GMP_CXX_LINK: "-lm -lgmp -lgmpxx"
      BOOST_INCDIR: "/usr/include"
      BOOST_LINK: "/usr/lib/x86_64-linux-gnu/libboost_serialization.a"
      EIGEN_PATH: /home/runner/work/opt/eigen
      EIGEN_INSTALL: /home/runner/work/opt/eigen-install
      NAUTY_PATH: /home/runner/work/opt/nauty
      NAUTY_INCLUDE: "-I/home/runner/work/opt/nauty/include"
      NAUTY_LINK: "/home/runner/work/opt/nauty/lib/libnauty.a"
      LIBBLISS_PATH: /home/runner/opt/libbliss
      LIBBLISS_INCDIR: /home/runner/opt/libbliss/include
      LIBBLISS_LINK: "-L/home/runner/opt/libbliss/lib -lbliss -Wl,-rpath,/home/runner/opt/libbliss/lib"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-boost
      - uses: ./.github/actions/install-mpi
      - uses: ./.github/actions/install-eigen

      - name: Install GMP and the Eigen CMake package
        run: |
          sudo apt-get install -y libgmp-dev
          # find_package(Eigen3) wants the Eigen3Config.cmake of an installed
          # Eigen, while install-eigen only unpacks the sources at EIGEN_PATH.
          # Eigen 3.3.9 asks for CMake 2.8, which CMake 4 refuses without the
          # policy minimum.
          cmake -S "$EIGEN_PATH" -B eigen-build -DCMAKE_INSTALL_PREFIX="$EIGEN_INSTALL" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --install eigen-build

      - name: Build the code
        run: |
          ls
          echo "After ls"

          pwd
          echo "After pwd"

          mkdir build && cd build
          cmake -DCMAKE_PREFIX_PATH="$EIGEN_INSTALL" ..
          make


