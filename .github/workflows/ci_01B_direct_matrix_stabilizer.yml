name: CI(01B) of the stabilizers of non-symmetric matrices

# https://help.github.com/en/articles/events-that-trigger-workflows#release-event-release
# model taken from https://github.com/mockersf/kmanb/releases
# on: release

# The stabilizer of a matrix given directly (GRP_DirectMatrix_Stabilizer)
# and the automorphism group of a configuration of vectors for a
# non-symmetric Gram matrix (GRP_LinPolytope_Automorphism_GramMat), on
# matrices whose groups are known.

on:
  # Day 1 of the even months; ci_01A takes the odd months
  schedule:
    - cron: "0 0 1 2,4,6,8,10,12 *"
  # Manually triggered
  workflow_dispatch:
  # Disabled right now, when a push is made on master.
jobs:
  build-linux:
    timeout-minutes: 60  # the suite takes about a minute, the builds a few
    runs-on: ubuntu-latest
    env:
      GMP_INCDIR: /usr/include
      GMP_CXX_LINK: "-lm -lgmp -lgmpxx"
      BOOST_INCDIR: "/usr/include"
      BOOST_LINK: "/usr/lib/x86_64-linux-gnu/libboost_serialization.a"
      EIGEN_PATH: /home/runner/work/opt/eigen
      NAUTY_PATH: /home/runner/work/opt/nauty
      NAUTY_INCLUDE: "-I/home/runner/work/opt/nauty/include"
      NAUTY_LINK: "/home/runner/work/opt/nauty/lib/libnauty_static.a"
      LIBBLISS_PATH: /home/runner/opt/libbliss
      LIBBLISS_INCDIR: /home/runner/opt/libbliss/include
      LIBBLISS_LINK: "-L/home/runner/opt/libbliss/lib -lbliss -Wl,-rpath,/home/runner/opt/libbliss/lib"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-boost

      - uses: ./.github/actions/install-nauty
      - uses: ./.github/actions/install-bliss
      - uses: ./.github/actions/install-eigen
      - uses: ./.github/actions/install-gap
      - name: Compiling the test programs.
        run: |
          # One standalone command per build, so that a failing make is not
          # hidden inside an && list.
          make -C src_group GRP_DirectMatrix_Stabilizer
          make -C src_group GRP_LinPolytope_Automorphism_GramMat
          echo "After compilation of group code"

      - name: Test the stabilizers of non-symmetric matrices
        run: |
          cd CI_tests/01B_NonSymmetricStabilizers
          ../../gap.sh TestNonSymmetricStabilizers.g
          if [ ! -f "CI_CONCLUSION" ]; then
            echo "The gap test code has not created the expected file" >&2
            exit 1
          fi
          cd ../..
          echo "After the tests of the stabilizers of non-symmetric matrices"
