name: CI(03B) of order-k Delaunay tilings and (L,k)-types

on:
  # Even months (the A slot of day 3 is the iso-Delaunay enumeration)
  schedule:
    - cron: "0 0 3 2,4,6,8,10,12 *"
  # Manually triggered
  workflow_dispatch:
  # Disabled right now, when a push is made on master.
jobs:
  build-linux:
    timeout-minutes: 120  # 2 hours
    runs-on: ubuntu-latest
    env:
      GMP_INCDIR: /usr/include
      GMP_CXX_LINK: "-lm -lgmp -lgmpxx"
      BOOST_INCDIR: "/usr/include"
      BOOST_LINK: "/usr/lib/x86_64-linux-gnu/libboost_serialization.a"
      EIGEN_PATH: /home/runner/work/opt/eigen
      NAUTY_PATH: /home/runner/work/opt/nauty
      NAUTY_INCLUDE: "-I/home/runner/work/opt/nauty/include"
      NAUTY_LINK: "/home/runner/work/opt/nauty/lib/libnauty_static.a"
      LIBBLISS_PATH: /home/runner/opt/libbliss
      LIBBLISS_INCDIR: /home/runner/opt/libbliss/include
      LIBBLISS_LINK: "-L/home/runner/opt/libbliss/lib -lbliss -Wl,-rpath,/home/runner/opt/libbliss/lib"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-boost

      - uses: ./.github/actions/install-nauty
      - uses: ./.github/actions/install-bliss
      - uses: ./.github/actions/install-eigen
      - uses: ./.github/actions/install-gap
      - name: Test the order-k Delaunay tilings and the (L,k)-type enumeration
        run: |
          make -C src_k_coverings
          echo "After compilation of LATT_SerialComputeKDelaunay and LATT_SerialLattice_IsoKDelaunayDomain"

          cd CI_tests/03B_KCovering
          ../../gap.sh < TestKCovering.g
          if [ ! -f "CI_CONCLUSION" ]; then
            echo "The gap test code has not created the expected file" >&2
            exit 1
          fi
          cd ../..
          echo "After the tests"
