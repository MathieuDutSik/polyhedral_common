name: 'Install GAP'
description: 'Install GAP from the distribution packages, leaving a gap.sh symlink in the workspace root.'
runs:
  using: 'composite'
  steps:
    - name: Install GAP
      shell: bash
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y gap
        ln -sf "$(command -v gap)" gap.sh
        echo 'Print("GAP ", GAPInfo.Version, "\n"); QUIT;' | ./gap.sh -q
