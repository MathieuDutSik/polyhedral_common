name: 'Install flint'
description: 'Install flint (with Arb) from the distribution packages. The Makefiles then find it with their defaults, FLINT_INCDIR = GMP_INCDIR and FLINT_LINK = -lflint, so the calling workflow sets neither.'
runs:
  using: 'composite'
  steps:
    - name: Install flint
      shell: bash
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y libflint-dev libmpfr-dev
        dpkg -s libflint-dev | grep '^Version'
